services:
  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      REDIS_ADDR: redis:6379
      REDIS_DB: 14
      WORKERS: 8
      QUEUE: default
      LEASE: 3s
      RECOVERY_INTERVAL: 1s
    depends_on:
      redis:
        condition: service_healthy